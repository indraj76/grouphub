spring.application.name=grouphub-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/grouphub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12072004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.admin-username=${ADMIN_USERNAME:admin@example.com}
app.admin-password=${ADMIN_PASSWORD:ChangeMe123!}
app.jwt-secret=${JWT_SECRET:change-this-secret-key-to-a-random-value-at-least-32-bytes-long}
# GroupHub Telegram verification
telegram.bot-token=${TG_BOT_TOKEN:}
grouphub.admin-key=${ADMIN_KEY:}
grouphub.auto-approve=false